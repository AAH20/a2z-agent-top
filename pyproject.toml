[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "a2z-agent-top"
version = "1.0.0"
description = "Real-Time Agent Swarm Observability, Interception & Hardware Telemetry Console (htop for AI Agent Swarms)"
readme = "README.md"
authors = [
  { name = "Ahmed Hassan", email = "aah@a2zsoc.com" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["agent", "htop", "swarm", "paperclip", "hermes", "mcp", "nvidia", "observability", "tui"]
dependencies = []

[project.scripts]
agent-top = "a2z_agent_top.cli:main"
atop = "a2z_agent_top.cli:main"

[project.urls]
Homepage = "https://a2zsoc.com"
Repository = "https://github.com/AAH20/a2z-agent-top"
